name: Build Spring Boot

on:
  push:
# すべてのブランチが対象
#    branches: [ main, develop ]
  pull_request:
# すべてのブランチが対象
#    branches: [ main, develop ]
    # types 
    # - PR作成（opened）
    # - PR更新（synchronize：pushされたとき）
    # - 再オープン（reopened）
    # - マージ（closed + merged=true）
    # - クローズ（closed）
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
