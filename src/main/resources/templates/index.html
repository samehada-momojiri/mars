<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0a0710;
      }

      .hero-bg {
        background:
          linear-gradient(to bottom, rgba(7, 5, 12, 0.2), rgba(7, 5, 12, 0.65)),
          url("/images/mars_bg.png");
        background-size: cover;
        background-position: center;
      }

      .glass {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body class="text-white">
    <div class="min-h-screen hero-bg relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/40"></div>

      <header class="relative z-10">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-6 lg:px-10">
          <a href="#" class="flex items-center gap-3 text-3xl font-serif tracking-wide">
            <span class="h-5 w-5 rounded-full bg-stone-300/80 shadow-[0_0_24px_rgba(255,255,255,0.25)]"></span>
            <span>Mars</span>
          </a>

          <nav class="hidden items-center gap-10 text-lg text-white/90 md:flex">
            <a href="#" class="border-b border-amber-400 pb-1 text-white">Home</a>
            <a href="#about" class="transition hover:text-amber-200">About</a>
            <a href="#gallery" class="transition hover:text-amber-200">Gallery</a>
            <a href="#missions" class="transition hover:text-amber-200">Missions</a>
            <a
              href="#contact"
              class="rounded-full border border-white/40 px-6 py-2 transition hover:border-white/70 hover:bg-white/10"
              >Contact</a
            >
          </nav>
        </div>
      </header>

      <main class="relative z-10">
        <section class="mx-auto flex min-h-[calc(100vh-88px)] max-w-7xl items-center px-6 pb-20 pt-8 lg:px-10">
          <div class="max-w-4xl">
            <p class="mb-4 text-sm uppercase tracking-[0.5em] text-white/70 md:text-base">
              Explore the Red Planet
            </p>
            <h1 class="text-6xl font-light tracking-[0.25em] text-white drop-shadow-2xl md:text-8xl lg:text-[9rem]">
              MARS
            </h1>
            <p class="mt-6 max-w-2xl text-lg leading-8 text-white/85 md:text-xl">
              Untamed horizons, endless dust valleys, and the dream of humanity’s next frontier.
              A cinematic landing page designed for a bold, future-facing Mars project.
            </p>

            <div class="mt-10 flex flex-col gap-4 sm:flex-row">
              <a
                th:href="@{'/explore'}"
                class="inline-flex items-center justify-center rounded-full bg-white/90 px-8 py-4 text-lg font-medium text-orange-700 shadow-2xl shadow-orange-900/30 transition hover:-translate-y-0.5 hover:bg-white"
              >
                Explore
              </a>
              <a
                href="#about"
                class="glass inline-flex items-center justify-center rounded-full border border-white/30 bg-white/10 px-8 py-4 text-lg font-medium text-white transition hover:bg-white/15"
              >
                Learn More
              </a>
              <a
                th:href="@{'/tasks/new'}"
                class="inline-flex items-center justify-center rounded-full border border-amber-200/60 bg-amber-100/20 px-8 py-4 text-lg font-medium text-amber-100 transition hover:bg-amber-100/30"
              >
                タスク登録
              </a>
            </div>
          </div>
        </section>

        <section id="about" class="bg-[#0b0811]/90">
          <div class="mx-auto max-w-7xl px-6 py-16 lg:px-10">
            <p th:if="${tasksError}" th:text="${tasksError}" class="rounded-xl border border-red-300/30 bg-red-900/20 px-4 py-3 text-red-200"></p>

            <div th:if="${#lists.isEmpty(tasks)}" class="rounded-2xl border border-white/10 bg-white/5 p-6 text-white/70">
              タスクはありません。
            </div>

            <div th:unless="${#lists.isEmpty(tasks)}" class="grid gap-6 lg:grid-cols-3">
              <div th:each="task : ${tasks}" class="glass rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl shadow-black/20">
                <p th:text="${task.completed} ? '処理済' : '未処理'" class="text-sm uppercase tracking-[0.3em] text-orange-200/80"></p>
                <h2 th:text="${task.title}" class="mt-3 text-2xl font-semibold"></h2>
                <p th:text="${task.description}" class="mt-4 text-white/75"></p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
